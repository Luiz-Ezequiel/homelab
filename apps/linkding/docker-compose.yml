services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    ports:
      - "${LD_HOST_PORT}:9090"
    volumes:
      - linkding-data:/etc/linkding/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  linkding-data:
:
